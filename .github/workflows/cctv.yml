name: 교통 CCTV 목록 갱신

# 월 호출 한도(100건)를 아끼려고 일주일에 한 번만 (1회 실행 = 2건)
on:
  schedule:
    - cron: '23 18 * * 0'   # 매주 월요일 03:23 (한국시간)
  workflow_dispatch: {}      # Actions 탭 → 교통 CCTV 목록 갱신 → Run workflow 로 수동 실행

permissions:
  contents: write

concurrency:
  group: cctv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 전국 CCTV 위치 가져오기
        env:
          ITS_KEY: ${{ secrets.ITS_KEY }}
          ITS_LIMIT: '100'
        run: python3 scripts/fetch_cctv.py

      - name: 바뀌었으면 저장
        run: |
          git config user.name "cctv-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain cctv.json)" ]; then
            git add cctv.json
            git commit -m "교통 CCTV 목록 갱신 $(TZ=Asia/Seoul date +'%m-%d %H:%M')"
            git pull --rebase --autostash || true
            git push
          else
            echo "변경 없음"
          fi
