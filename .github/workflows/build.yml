name: APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 서명키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 Secret이 없어 임시 키로 서명합니다. 이 경우 업데이트할 때마다 앱을 지우고 다시 설치해야 합니다."
          fi

      - name: APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk hako-nfz.apk

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: hako-nfz-apk
          path: hako-nfz.apk

      - name: 다운로드 페이지(Release)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 하코 NFZ 조회 v1.0.${{ github.run_number }}
          body: |
            하코 NFZ 조회 안드로이드 앱입니다.
            아래 **hako-nfz.apk** 를 눌러 내려받아 설치하세요.
          files: hako-nfz.apk
          make_latest: true
