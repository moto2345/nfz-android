name: APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 서명키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 Secret이 없어 임시 키로 서명합니다."
            exit 0
          fi
          # 붙여넣을 때 섞인 공백·줄바꿈 제거 후 파일로 복원
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' > "$RUNNER_TEMP/ks.b64"
          if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 값이 올바르지 않습니다. GitHub_Secrets_값.txt 맨 아래의 긴 한 줄(/u3+7QAAAA…로 시작)을 전부 다시 붙여넣으세요."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::서명키를 열 수 없습니다. KEYSTORE_PASSWORD(비밀번호) 또는 KEYSTORE_BASE64 값을 다시 확인하세요."
            exit 1
          fi
          echo "서명키 확인 완료"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk hako-nfz.apk

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: hako-nfz-apk
          path: hako-nfz.apk

      - name: 다운로드 페이지(Release)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 하코 NFZ 조회 v1.0.${{ github.run_number }}
          body: |
            하코 NFZ 조회 안드로이드 앱입니다.
            아래 **hako-nfz.apk** 를 눌러 내려받아 설치하세요.
          files: hako-nfz.apk
          make_latest: true
